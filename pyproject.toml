[project]
name = "idsdata"
version = "0.1.0"
description = "Versioned, checksummed loaders and a linter for intrusion-detection datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Samuel Justus Schwertfeger", email = "113480134+SamuelSchwertfeger@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = ["intrusion detection", "datasets", "CIC-IDS2017", "reproducibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[project.urls]
Repository = "https://github.com/SamuelSchwertfeger/idsdata"
Issues = "https://github.com/SamuelSchwertfeger/idsdata/issues"

[project.scripts]
idsdata = "idsdata.cli:main"
ids-lint = "idsdata.lint:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
# pandas and pyarrow ship no type stubs, so values that come from them are unknown.
reportMissingTypeStubs = false
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
