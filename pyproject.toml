[project]
name = "idsdata"
version = "0.1.0"
description = "Versioned, checksummed loaders and a linter for intrusion-detection datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Samuel Justus Schwertfeger", email = "113480134+SamuelSchwertfeger@users.noreply.github.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.10"
